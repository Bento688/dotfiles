# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# run-shell -b '~/.tmux/plugins/tmux-continuum/continuum.tmux'
set -g @plugin 'tmux-plugins/tmux-open'

set -g @continuum-restore 'on'

set -g mouse on

# Make the status bar background transparent
set -g status-style bg=default

# Overwrite Prefix key to Ctrl + Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Prefix + r => reload
bind r source-file ~/.config/tmux/tmux.conf

# Tmux numbering starts from 1
set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

# Fix Shift + Enter for opencode
set -s extended-keys on
set -as terminal-features 'tmux-256color:extkeys'
bind-key -n S-Enter send-keys Escape "[13;2u"

# Key binds for splitting panes
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

bind -n M-H previous-window
bind -n M-L next-window

# ============================================================
# DESIGN TWEAKS
# Minimal / transparent / Everforest-friendly
# ============================================================

# ------------------------------------------------------------
# Terminal / color support
# ------------------------------------------------------------

set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-ghostty:Tc"
set-option -sa terminal-features ",xterm-ghostty:RGB"


# ------------------------------------------------------------
# Bell
# ------------------------------------------------------------

set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none


# ------------------------------------------------------------
# Clock mode
# ------------------------------------------------------------

setw -g clock-mode-colour yellow


# ------------------------------------------------------------
# Copy mode
# ------------------------------------------------------------

setw -g mode-style 'fg=black,bg=cyan'


# ------------------------------------------------------------
# Panes
# ------------------------------------------------------------

set -g pane-border-style 'fg=brightblack'
set -g pane-active-border-style 'fg=cyan'
set -g pane-border-lines heavy # (single, double, heavy)

# set -g window-style 'bg=#1e2325'
set -g window-style 'bg=terminal'
set -g window-active-style 'bg=terminal'

# ------------------------------------------------------------
# Status bar
# ------------------------------------------------------------

set -g status-position bottom
set -g status-justify left

set -g status-style 'fg=brightblack,bg=default'

set -g status-left ''
set -g status-left-length 10

set -g status-right-style 'fg=brightblack,bg=default'
set -g status-right '#[fg=cyan]%Y-%m-%d #[fg=magenta]%H:%M '
set -g status-right-length 50


# ------------------------------------------------------------
# Windows
# ------------------------------------------------------------

setw -g window-status-current-style 'fg=cyan,bg=default,bold'
setw -g window-status-current-format ' #I #[fg=cyan,bold]#W #[fg=magenta]#F '

setw -g window-status-style 'fg=brightblack,bg=default'
setw -g window-status-format ' #I #[fg=brightblack]#W #[fg=magenta]#F '

setw -g window-status-bell-style 'fg=red,bg=default,bold'


# ------------------------------------------------------------
# Messages / command prompt
# ------------------------------------------------------------

set -g message-style 'fg=cyan bg=default bold'

# set Vi mode
setw -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# image.nvim support
set -gq allow-passthrough on
set -g visual-activity off
set-option -g focus-events on

run '~/.config/tmux/plugins/tpm/tpm'

# resize panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
